envVarGroups:
  - name: mdp-shared-env
    envVars:
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TOKEN_ISSUER
        value: mdp-system
      - key: GPS_RADIUS_METERS
        value: "100"
      - key: SALARY_HOURLY_RATE
        value: "35000"
      - key: SALARY_STANDARD_HOURS
        value: "208"
      - key: SALARY_OVERTIME_MULTIPLIER
        value: "1.5"
      - key: SALARY_BUSINESS_START_HOUR
        value: "8"
      - key: SALARY_LUNCH_START_HOUR
        value: "12"
      - key: SALARY_LUNCH_END_HOUR
        value: "13"
      - key: SALARY_BUSINESS_END_HOUR
        value: "17"
      - key: SALARY_HOLIDAY_MODE
        value: exclude
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RECAPTCHA_MODE
        value: v2_checkbox
      - key: RECAPTCHA_ACTION
        value: login
      - key: RECAPTCHA_MIN_SCORE
        value: "0.5"
      - key: RECAPTCHA_EXPECTED_ACTION
        value: login

databases:
  - name: mdp-postgres
    plan: free
    databaseName: mdp_system
    user: mdp_user

services:
  - type: pserv
    runtime: image
    name: mdp-minio
    plan: starter
    region: singapore
    image:
      url: docker.io/minio/minio:latest
    dockerCommand: server /data --address ":10000" --console-address ":10001"
    disk:
      name: mdp-minio-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false

  - type: pserv
    runtime: docker
    name: mdp-auth-service
    plan: starter
    region: singapore
    dockerfilePath: ./services/auth-service/Dockerfile
    dockerContext: ./services/auth-service
    envVars:
      - fromGroup: mdp-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: mdp-postgres
          property: connectionString

  - type: pserv
    runtime: docker
    name: mdp-user-service
    plan: starter
    region: singapore
    dockerfilePath: ./services/user-service/Dockerfile
    dockerContext: ./services/user-service
    envVars:
      - fromGroup: mdp-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: mdp-postgres
          property: connectionString
      - key: MINIO_ENDPOINT
        fromService:
          name: mdp-minio
          type: pserv
          property: host
      - key: MINIO_PORT
        fromService:
          name: mdp-minio
          type: pserv
          property: port
      - key: MINIO_USE_SSL
        value: "false"
      - key: MINIO_ACCESS_KEY
        fromService:
          name: mdp-minio
          type: pserv
          envVarKey: MINIO_ROOT_USER
      - key: MINIO_SECRET_KEY
        fromService:
          name: mdp-minio
          type: pserv
          envVarKey: MINIO_ROOT_PASSWORD
      - key: MINIO_BUCKET
        value: face-enrollments

  - type: pserv
    runtime: docker
    name: mdp-project-service
    plan: starter
    region: singapore
    dockerfilePath: ./services/project-service/Dockerfile
    dockerContext: ./services/project-service
    envVars:
      - fromGroup: mdp-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: mdp-postgres
          property: connectionString

  - type: pserv
    runtime: docker
    name: mdp-attendance-service
    plan: starter
    region: singapore
    dockerfilePath: ./services/attendance-service/Dockerfile
    dockerContext: ./services/attendance-service
    envVars:
      - fromGroup: mdp-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: mdp-postgres
          property: connectionString

  - type: pserv
    runtime: docker
    name: mdp-notification-service
    plan: starter
    region: singapore
    dockerfilePath: ./services/notification-service/Dockerfile
    dockerContext: ./services/notification-service
    envVars:
      - fromGroup: mdp-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: mdp-postgres
          property: connectionString

  - type: pserv
    runtime: docker
    name: mdp-request-service
    plan: starter
    region: singapore
    dockerfilePath: ./services/request-service/Dockerfile
    dockerContext: ./services/request-service
    envVars:
      - fromGroup: mdp-shared-env
      - key: DATABASE_URL
        fromDatabase:
          name: mdp-postgres
          property: connectionString

  - type: web
    runtime: docker
    name: mdp-gateway
    plan: free
    region: singapore
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: ./gateway
    healthCheckPath: /health
    envVars:
      - fromGroup: mdp-shared-env
      - key: AUTH_SERVICE_HOST
        fromService:
          name: mdp-auth-service
          type: pserv
          property: host
      - key: AUTH_SERVICE_PORT
        fromService:
          name: mdp-auth-service
          type: pserv
          property: port
      - key: USER_SERVICE_HOST
        fromService:
          name: mdp-user-service
          type: pserv
          property: host
      - key: USER_SERVICE_PORT
        fromService:
          name: mdp-user-service
          type: pserv
          property: port
      - key: PROJECT_SERVICE_HOST
        fromService:
          name: mdp-project-service
          type: pserv
          property: host
      - key: PROJECT_SERVICE_PORT
        fromService:
          name: mdp-project-service
          type: pserv
          property: port
      - key: ATTENDANCE_SERVICE_HOST
        fromService:
          name: mdp-attendance-service
          type: pserv
          property: host
      - key: ATTENDANCE_SERVICE_PORT
        fromService:
          name: mdp-attendance-service
          type: pserv
          property: port
      - key: NOTIFICATION_SERVICE_HOST
        fromService:
          name: mdp-notification-service
          type: pserv
          property: host
      - key: NOTIFICATION_SERVICE_PORT
        fromService:
          name: mdp-notification-service
          type: pserv
          property: port
      - key: REQUEST_SERVICE_HOST
        fromService:
          name: mdp-request-service
          type: pserv
          property: host
      - key: REQUEST_SERVICE_PORT
        fromService:
          name: mdp-request-service
          type: pserv
          property: port

  - type: web
    runtime: static
    name: mdp-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
      - key: VITE_RECAPTCHA_SITE_KEY
        sync: false
      - key: VITE_RECAPTCHA_ACTION
        value: login
